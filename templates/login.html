{% extends "base.html" %}

{% block title %}Login - TrekOut{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card glass-panel border-0 shadow-sm rounded-4 p-4 mt-5">
        <div class="text-center mb-4">
            <i class="fa-solid fa-mountain-sun text-warning fs-1 mb-2"></i>
            <h2 class="font-outfit fw-bold mb-1">Welcome Back</h2>
            <p class="text-muted small">Log in to manage your trek activities</p>
        </div>

        <form action="{{ url_for('main.login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-dark">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold"><i class="fa-solid fa-right-to-bracket me-1"></i> Log In</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('main.register') }}" class="text-warning fw-semibold">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
