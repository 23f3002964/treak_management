{% extends "base.html" %}

{% block title %}Server Error - TrekOut{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 500px;">
    <div class="card glass-panel border-0 p-5 mt-5 rounded-4 shadow-sm">
        <div class="text-danger mb-4">
            <i class="fa-solid fa-triangle-exclamation display-2"></i>
        </div>
        <h1 class="display-5 font-outfit fw-bold text-dark">500</h1>
        <h2 class="h4 font-outfit text-muted mb-3">Internal Server Error</h2>
        <p class="text-muted small mb-4">An unexpected error occurred on our server. We are looking into it.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fa-solid fa-house me-1"></i> Return Home</a>
    </div>
</div>
{% endblock %}
