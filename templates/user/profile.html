{% extends "base.html" %}

{% block title %}My Profile - TrekOut{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card glass-panel border-0 p-4 mt-4 shadow-sm rounded-4">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-gear text-warning fs-1 mb-2"></i>
            <h2 class="font-outfit fw-bold text-dark mb-1">Edit My Profile</h2>
            <p class="text-muted small">Update your contact information and login password</p>
        </div>

        <form action="{{ url_for('main.trekker_profile') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="text" class="form-control bg-light border-start-0" value="{{ user.username }}" disabled>
                </div>
                <div class="form-text text-xs" style="font-size: 0.75rem;">Username cannot be changed after registration.</div>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold text-dark">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-id-card"></i></span>
                    <input type="text" class="form-control border-start-0" id="name" name="name" value="{{ user.name }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="contact_details" class="form-label small fw-semibold text-dark">Contact Information</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="text" class="form-control border-start-0" id="contact_details" name="contact_details" value="{{ user.contact_details }}" required>
                </div>
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-dark">New Password (Leave blank to keep current)</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-key"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter new password">
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2 fw-semibold"><i class="fa-solid fa-circle-check me-1"></i> Update Profile</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
